<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yönetici Girişi | Çiçek Apartmanı</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #4f46e5;
      --primary-light: #eef2ff;
      --danger: #ef4444;
      --danger-light: #fef2f2;
      --bg: #f1f5f9;
      --bg-card: #ffffff;
      --text-primary: #0f172a;
      --text-secondary: #64748b;
      --border: #e2e8f0;
      --radius: 14px;
      --shadow: 0 20px 60px rgba(0,0,0,0.12);
      --transition: 0.2s ease;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      background-image: radial-gradient(circle at 20% 20%, #ede9fe 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, #dbeafe 0%, transparent 50%);
    }

    .login-wrapper {
      width: 100%;
      max-width: 420px;
    }

    .login-brand {
      text-align: center;
      margin-bottom: 2rem;
    }

    .login-brand-icon {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, var(--primary), #7c3aed);
      border-radius: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      color: #fff;
      margin-bottom: 1rem;
      box-shadow: 0 8px 24px rgba(79,70,229,0.35);
    }

    .login-brand h1 {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--text-primary);
    }

    .login-brand p {
      font-size: 0.875rem;
      color: var(--text-secondary);
      margin-top: 0.25rem;
    }

    .login-card {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 2rem;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    .login-card h2 {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .login-card h2 i {
      color: var(--primary);
    }

    .form-group {
      margin-bottom: 1.1rem;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 0.4rem;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper i {
      position: absolute;
      left: 0.85rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .input-wrapper input {
      width: 100%;
      padding: 0.7rem 0.85rem 0.7rem 2.5rem;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      font-family: 'Inter', sans-serif;
      color: var(--text-primary);
      background: #f8fafc;
      transition: var(--transition);
      outline: none;
    }

    .input-wrapper input:focus {
      border-color: var(--primary);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(79,70,229,0.1);
    }

    .toggle-pass {
      position: absolute;
      right: 0.85rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 0.9rem;
      padding: 0.2rem;
    }

    .error-msg {
      display: none;
      align-items: center;
      gap: 0.4rem;
      background: var(--danger-light);
      color: var(--danger);
      font-size: 0.82rem;
      font-weight: 600;
      padding: 0.6rem 0.85rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      border: 1px solid #fecaca;
    }

    .error-msg.visible {
      display: flex;
    }

    .btn-login {
      width: 100%;
      padding: 0.8rem;
      background: linear-gradient(135deg, var(--primary), #7c3aed);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: var(--transition);
      box-shadow: 0 4px 14px rgba(79,70,229,0.35);
      margin-top: 0.5rem;
    }

    .btn-login:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }

    .btn-login:active {
      transform: translateY(0);
    }

    .login-footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.78rem;
      color: var(--text-secondary);
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      color: var(--primary);
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 600;
      margin-top: 1rem;
    }

    .back-link:hover { text-decoration: underline; }

    @media (max-width: 480px) {
      .login-card { padding: 1.5rem; }
    }
  </style>
</head>
<body>

  <div class="login-wrapper">
    <div class="login-brand">
      <div class="login-brand-icon">
        <i class="fa-solid fa-building-user"></i>
      </div>
      <h1>Çiçek Apartmanı</h1>
      <p>Yönetim Paneline erişim için giriş yapın</p>
    </div>

    <div class="login-card">
      <h2><i class="fa-solid fa-lock"></i> Yönetici Girişi</h2>

      <div class="error-msg" id="errorMsg">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span>Kullanıcı adı veya şifre hatalı. Lütfen tekrar deneyin.</span>
      </div>

      <form id="loginForm" autocomplete="off">
        <div class="form-group">
          <label for="loginUser">Kullanıcı Adı</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-user"></i>
            <input type="text" id="loginUser" placeholder="Kullanıcı adınızı girin" autocomplete="username" required>
          </div>
        </div>

        <div class="form-group">
          <label for="loginPass">Şifre</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-key"></i>
            <input type="password" id="loginPass" placeholder="Şifrenizi girin" autocomplete="current-password" required>
            <button type="button" class="toggle-pass" id="togglePass" title="Şifreyi Göster/Gizle">
              <i class="fa-solid fa-eye" id="togglePassIcon"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-login" id="loginBtn">
          <i class="fa-solid fa-right-to-bracket"></i>
          Giriş Yap
        </button>
      </form>
    </div>

    <div style="text-align:center; margin-top:1.25rem;">
      <a class="back-link" href="index.html">
        <i class="fa-solid fa-arrow-left"></i> Sakin Bilgilendirme Sayfasına Dön
      </a>
    </div>

    <div class="login-footer">
      &copy; 2026 Çiçek Apartmanı Yönetim Sistemi
    </div>
  </div>

  <script>
    // -- Auth Check: redirect if already logged in --
    if (sessionStorage.getItem('adminAuth') === 'true') {
      window.location.replace('admin/index.html');
    }

    // -- Credentials (client-side only) --
    const ADMIN_USER = 'atillahos';
    const ADMIN_PASS = 'uiz@=x*8C42oa^V1)D8c*Gn';

    // -- Toggle password visibility --
    document.getElementById('togglePass').addEventListener('click', function () {
      const input = document.getElementById('loginPass');
      const icon = document.getElementById('togglePassIcon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'fa-solid fa-eye-slash';
      } else {
        input.type = 'password';
        icon.className = 'fa-solid fa-eye';
      }
    });

    // -- Login Form Submit --
    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const user = document.getElementById('loginUser').value.trim();
      const pass = document.getElementById('loginPass').value;
      const errMsg = document.getElementById('errorMsg');

      if (user === ADMIN_USER && pass === ADMIN_PASS) {
        sessionStorage.setItem('adminAuth', 'true');
        window.location.href = 'admin/index.html';
      } else {
        errMsg.classList.add('visible');
        document.getElementById('loginPass').value = '';
        document.getElementById('loginPass').focus();
      }
    });

    // Hide error on input change
    document.getElementById('loginUser').addEventListener('input', () => {
      document.getElementById('errorMsg').classList.remove('visible');
    });
    document.getElementById('loginPass').addEventListener('input', () => {
      document.getElementById('errorMsg').classList.remove('visible');
    });
  </script>
</body>
</html>
